<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a1420"/>
      <stop offset="60%" stop-color="#0c0a10"/>
      <stop offset="100%" stop-color="#050409"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D98A"/>
      <stop offset="45%" stop-color="#D89A2E"/>
      <stop offset="55%" stop-color="#F6D98A"/>
      <stop offset="100%" stop-color="#B87A1E"/>
    </linearGradient>

    <linearGradient id="wordmark-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6D98A"/>
      <stop offset="100%" stop-color="#D89A2E"/>
    </linearGradient>

    <pattern id="habz-texture" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <text x="8" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#E7B24C" opacity="0.055">₻</text>
      <text x="52" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#E7B24C" opacity="0.05">₻</text>
    </pattern>

    <path id="rimTop" d="M 100,320 A 220,220 0 0 1 540,320"/>
    <path id="rimBottom" d="M 130,410 A 220,220 0 0 0 510,410"/>

    <clipPath id="coinClip">
      <circle cx="320" cy="320" r="300"/>
    </clipPath>
  </defs>

  <!-- outer minted rim -->
  <circle cx="320" cy="320" r="308" fill="url(#rim)"/>
  <circle cx="320" cy="320" r="300" fill="url(#rim)" stroke="#0c0a10" stroke-width="2" opacity="0.9"/>

  <!-- beveled inner ring -->
  <circle cx="320" cy="320" r="284" fill="none" stroke="#0c0a10" stroke-width="3" opacity="0.55"/>
  <circle cx="320" cy="320" r="272" fill="none" stroke="#F6D98A" stroke-width="1.5" opacity="0.5"/>

  <!-- coin face -->
  <g clip-path="url(#coinClip)">
    <circle cx="320" cy="320" r="272" fill="url(#bg)"/>
    <circle cx="320" cy="320" r="272" fill="url(#habz-texture)"/>
  </g>

  <!-- mint-mark inscription along the rim -->
  <text font-family="'SF Mono','Courier New',monospace" font-size="21" letter-spacing="6" fill="#3a2a10">
    <textPath href="#rimTop" startOffset="50%" text-anchor="middle">★&#160;&#160;HABZ&#160;ECONOMY&#160;&#160;★</textPath>
  </text>
  <text font-family="'SF Mono','Courier New',monospace" font-size="19" letter-spacing="5" fill="#3a2a10">
    <textPath href="#rimBottom" startOffset="50%" text-anchor="middle">EST.&#160;WHATSAPP&#160;·&#160;AI&#160;ROAST&#160;BOT</textPath>
  </text>

  <!-- centered wordmark -->
  <text x="320" y="300" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif" font-size="92" font-style="italic" fill="url(#wordmark-fill)">𝓗𝓪𝓫𝓲𝓫𝓲</text>

  <text x="440" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="48">🎀</text>

  <text x="320" y="340" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="26" font-style="italic" fill="#FF4FA3">by 𝑆.</text>

  <line x1="255" y1="368" x2="385" y2="368" stroke="#E7B24C" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="320" y="392" text-anchor="middle" font-family="'SF Mono','Courier New',monospace" font-size="14" letter-spacing="1.5" fill="#F3ECDD" opacity="0.7">₻ HABZ · ONE ROAST AT A TIME</text>
</svg>
